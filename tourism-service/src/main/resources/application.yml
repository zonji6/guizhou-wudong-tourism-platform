server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: guizhou-wudong-tourism-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/wudong_tourism?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:wudong}
    password: ${MYSQL_PASSWORD:wudong_demo}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
info:
  app: 贵州乌冬文旅演示服务
