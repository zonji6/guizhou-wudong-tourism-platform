acceptance:
  - 为 knowledge/search 与 route-guides/search 增加 camelCase、extra=forbid 的严格 Pydantic 响应 DTO 和只读客户端；精确映射 KnowledgeView、CommunityViews.PostView/RouteNode，不得写请求、重定向、非回环地址或接受不受控响应。
  - 使用 PersistentAgentState 与 context_schema=RunContext；threadId/userText/pageAction/selectedTarget/conditions 仅经 runtime context 传递，threadId 仅作 checkpointer 配置键。每节点返回经 PersistentAgentState 验证、sanitize_checkpoint_payload 清洗后重新验证的完整八字段快照；仅声明 InMemorySaver 进程内连续性。
  - 条件分支覆盖 ITINERARY、KNOWLEDGE、PRODUCT、FOOD、STAY、PLACE、ROUTE_GUIDE、ORDER_STATUS、CLARIFICATION，且只输出严格六类 AssistantCardV2。目录、知识、攻略来自 Java 已发布只读结果；无数据、地图未配置、订单端点未实现或依赖不可用时稳定 ErrorCard，禁止虚构。
  - FOOD/STAY 仅在 selectedTarget 已由 Java 公开目录验证且时间/人数完整时生成无联系人、非持久化 OrderProposal；缺失时 ClarifyingQuestionCard，商品不得生成提案，禁止调用 Java 写接口。
  - custom 事件仅 progress/tool_summary；run_assistant 独占 task_started、card_ready 和唯一 completed/failed，固定序列为 task_started、0..n custom、恰好一个 card_ready、恰好一个 completed 或 failed。出口再次验证，JSON 均 model_dump(mode="json", by_alias=True)。
  - HTTP 与 WebSocket 共用 run_assistant，切换 AssistantRequestV2/AssistantResponseV2，并通过 populate_by_name=True 兼容当前 snake_case 请求输入；不新增端点。
  - 仅静态验收：范围、导入引用、协议字段、隐私、事件序列与 git diff --check；标记 IMPLEMENTED_NOT_RUNTIME_VERIFIED，不运行运行时验证。
