acceptance:
  - Web 和小程序各有 6 项服务，ID 严格为 10000000-0000-0000-0000-000000000001 至 000006；仅前两项茶旅使用 tea 图片及精确 imageAlt；住宿、餐食、苗绣、接驳图片为空并用类别语义占位，不得错配村寨、人物、务农或溪流；社区第一条用茶图和 coverAlt，第二条无图。
  - 两端 normalizeService 按稳定 ID 合并 fallback，Java 逗号标签转数组，API 图片只有 imageUrl 加 imageAlt 成对才采用，否则策展图或占位；默认 demoData。Web App 使用该统一规范化函数，不能再让字符串 tags.join 报错。
  - 两端定义同构 demoAssistantCard，必须包含 data.demoMode、retrievalMode=keyword_demo、两日 days/items、真实 serviceId、逐项 demoData、notice、source title 与 document_id；只定义或导出，不自动载入。
  - 未点击时后续首页内容不能挂载或被滚动绕过，五联渐显只在开卷完成后开始；首页顶栏在开卷前不显示；同一 session 返回不重复。卷轴正常与 reduced motion 都确定完成。
  - HomePage 顺序为 gate、五联、探景、沿溪、衣食住行、assistant 命名插槽；叶片只滚到该插槽，插槽可提供前往现有助手的轻量 fallback，但不实现任务 5 工作台。
  - SafeImage、FiveSceneHero、SceneExplorer 正确使用 desktopFocus 和 mobileFocus；移动五联保持一张主卡加露边；沿溪衣食住行节点呈路径或单列而非等宽卡片墙。
  - reduced motion 下卷轴、五联、雾、叶片不保留明显位移动画，且关闭动画时状态仍能进入 open 或 cleared，不会卡死。
  - 小程序工具首页新增 brand-hero、brand-copy、hero-fallback、trip 等都有完整紧凑品牌样式；存在 currentItinerary 或 pendingBooking 时显示继续入口；精选图失败不破图。
  - 小程序资源、社区正常图使用 imageAlt 或 coverAlt；缺图或失败显示包含乌东与类别语义的品牌色块，并有实际尺寸样式；异步接口数据仍用统一 normalizeService，分类意图不被覆盖。
  - 不提前重写 assistant、detail、booking、orders 为任务 8 工作台；不改 Java、Python、docs、control 之外的协作文件；不测试、不构建、不启动、不推送。
