  - public 仅返回 PUBLISHED 的 products、foods、stays 加 roomTypes、room-types/{id} 与 places；categoryTag、tag、peopleCount、roomTypeId 严格遵从冻结契约，API tags 为 string[]，不外泄 merchant contact。
