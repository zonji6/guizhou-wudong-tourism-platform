acceptance:
  - 新增严格 Pydantic 响应模型，覆盖成功/失败 ApiEnvelope、Product、FoodItem、StayProperty、RoomType、Place 与 MapPlacesResult；模型拒绝额外字段，tags 固定为 string[]，仅接受 catalogStatus=PUBLISHED 的目录与房型。
  - tourism_v2_client 仅使用异步 httpx GET 调用 products、foods、stays、places 的 /internal/agent/*/search 路由；不含任何写方法或现有流程接线。
  - 输入约束与 Java 一致：tag 查询参数可重复但标签值不得重复，且每个 tag 非空、无首尾空格、最长 80、不得含逗号；keywords 可省略，出现时非空、无首尾空格、最长 120；peopleCount 为单个正整数；roomTypeId 为单个规范 UUID；未知或重复的单值查询参数必须在客户端边界拒绝。
  - products 与 foods 只接受 PUBLISHED 目录；stays 与其 roomTypes 都只接受 PUBLISHED；places 的 MapPlacesResult 保留 AVAILABLE、NOT_CONFIGURED、DEGRADED 语义，非 AVAILABLE 状态不接受非空 places。
  - 对 HTTP、网络、非法 envelope 或模型校验失败，只返回稳定 code 和中文安全消息；不得把上游 URL、headers、body、stack、密钥或原始异常传给调用方。
  - 仅作静态验收：scope、契约、无写路由、无敏感泄露与 git diff --check；不运行测试、构建、服务、外部 API、数据库或 Flyway。
