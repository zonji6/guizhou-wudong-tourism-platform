acceptance:
  - GET /api/posts?type=&tag= 仅返回 published=true，SQL 过滤 type 为 MOMENT 或 ROUTE_GUIDE、tag 为单值；unknown 或重复 query 必须拒绝。
  - POST /api/posts 必须有规范 X-Visitor-Id、没有 query、严格字段白名单；不得接收 author、visitor、published、demo、image。MOMENT 的 title、routeSummary、routeNodes 只能省略或 null；ROUTE_GUIDE 必须有 title、routeSummary 与至少一个严格 RouteNode。
  - RouteNode 的 sequence 为唯一正整数并按序输出，placeId 可 null；非 null 时必须为规范 UUID 且地点存在并 PUBLISHED，否则分别返回 404 或 409。服务端生成匿名展示名，demoData=true、published=true。
  - public DTO 仅输出契约字段，排除 visitorId、published、coverUrl；tags 固定为 string[]，routeNodes 按 sequence。旧 V2 seed 默认投影为 MOMENT，即使数据库 title 非空也输出 title=null。
  - 不修改迁移、领域或 v1；不实现点赞、评论、图片审核、admin/internal/map/前端；不运行测试、Maven、构建、服务、Flyway 或外部调用。
