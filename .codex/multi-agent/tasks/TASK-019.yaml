acceptance:
  - 实现 GET /internal/agent/route-guides/search?keywords=&tag=&tag=，返回 ApiEnvelope<List<CommunityViews.PostView>>；未知参数、重复 keywords 或不允许的重复单值参数均由边界拒绝为 400 VALIDATION_FAILED。
  - 仅从 CommunityService.publicPosts("ROUTE_GUIDE", null) 读取，永不读取或返回 MOMENT、未发布数据或任何持久化内部字段；无结果返回成功空数组。
  - keywords 可省略；出现时必须非空、无首尾空格且最长 120，并对 title、content、routeSummary、tags、routeNodes.placeName、routeNodes.note 执行不区分大小写包含匹配。
  - tag 允许重复查询参数且按 AND 匹配；每个 tag 必须非空、无首尾空格、最长 80、不得含逗号，且重复 tag 值必须拒绝。查询和响应严格复用 PostView 白名单，不构造假攻略。
  - 不提供写路由、订单状态、run summaries 或其他新能力；不泄露 visitorId、published、route_nodes_json、订单、联系人、sourceThreadId、URL、SQL、堆栈或原始内部异常。
  - 仅作静态验收：scope、契约、无写路由、敏感字段排除与 git diff --check；不运行测试、Maven、构建、服务、Flyway、数据库、浏览器、网络或外部调用。
