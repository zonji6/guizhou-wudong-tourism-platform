acceptance:
  - V4 只向前新增，不修改 V1-V3，并保留 service_resource/booking v1 兼容层。
  - merchant 扩展 demo_data、catalog_status；community_post 扩展 visitor_id（历史可 NULL）、post_type、route_summary、route_nodes_json、published，并允许普通动态 title 为 NULL。
  - 新建 product、food_item、stay_property、room_type、place、product_order、food_order、stay_booking、agent_run_summary。
  - AI 待确认语义在 v2 契约固定为非持久化、不含联系人、requiresVisitorConfirmation=true 的 OrderProposal；前端补全联系人并 public POST 后才创建正式订单。
  - 商品订单状态为 PENDING_PICKUP/PICKED_UP/CANCELLED；餐食为 PENDING_VISIT/COMPLETED/CANCELLED；住宿为 PENDING_CONFIRMATION/CONFIRMED/COMPLETED/CANCELLED。
  - 所有目录表有 demoData 与 catalogStatus；place 经纬度可 NULL；V4 不得 INSERT、复制 v1 演示数据、写坐标、库存、房态、班次或新商家。
  - agent_run_summary 仅含 threadId、nodeName、toolCategory、公开 source titles、durationMs、finalStatus 等脱敏字段，不含 prompt、思维链、联系人、token、密钥、内部 URL、原始异常或完整参数。
  - tourism-api-v2 完整定义 public/admin/internal 路径、X-Visitor-Id、X-Admin-Token、状态机、错误语义和演示边界；地图外部条件缺失时固定 mapStatus=NOT_CONFIGURED、places=[]。
  - 目录、地点、管理员、订单、社区、内部 AI 的后续任务依赖该契约，但不在本任务实现；X-Visitor-Id 与共享管理员 Token 仅适合本机演示，不表述为生产身份。
  - 仅执行允许的静态检查，不运行 Maven、测试、构建、启动、Flyway、curl、浏览器或外部调用。
