acceptance:
  - X-Visitor-Id 缺失返回 400 VISITOR_ID_REQUIRED，非规范 UUID 返回 400 VISITOR_ID_INVALID；public 三类 POST 与 /api/me 三列表必需，SQL 直接按 visitor_id WHERE，public/me 投影不含 visitorId、contactName、contactPhone、sourceThreadId。
  - Product POST 严格字段白名单，商品与商家均 PUBLISHED，quantity 为正整数，pickupPoint 与公开目录完全一致，初始 PENDING_PICKUP；Food 的 visitAt/peopleCount 合法且初始 PENDING_VISIT；Stay 的房型、住宿、商家均 PUBLISHED，peopleCount 不大于 maxGuests，初始 PENDING_CONFIRMATION。联系人仅由公开确认页请求持久化；note/sourceThreadId 可选；demoData=true；不实现支付、库存、餐位或房态。
  - 目标不存在返回 404 RESOURCE_NOT_FOUND，存在但未发布返回 409 CATALOG_NOT_PUBLISHED，容量超限返回 409 CAPACITY_EXCEEDED；日期、时间、UUID、长度、unknown 与 null 必须严格解析。
  - admin 复用 TASK-011 token 保护，三类订单提供 GET ?status= 与 PATCH /{id}/status；admin 投影包含履约联系人和 visitor/sourceThread。商品 pending→picked/cancel，餐食 pending→completed/cancel，住宿 pending→confirmed/cancel、confirmed→completed/cancel；跨类型、跳跃、重复与终态转移均为 409 INVALID_STATUS_TRANSITION。
  - ApiRequestException 携带 HttpStatus、稳定 code 与安全中文 message；ApiExceptionHandler 精确返回动态状态，不泄露内部异常，且保持 TASK-011/v1 源码兼容。
  - 无 DELETE、AI/internal、社区、地图或前端；仅改 write_scope；不新增或运行测试，不运行 Maven、构建、服务、Flyway、curl、浏览器或外部调用。
