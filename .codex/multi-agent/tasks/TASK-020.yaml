acceptance:
  - Web 与小程序均通过严格协议适配器生成统一展示模型，并按平台能力映射执行动作；模板内不得散落 protocol 判别。
  - 首个 task_started 的 thread_id 锁定 legacy，threadId 锁定 v2；混合、缺失或冲突字段安全失败。cardVersion 缺失才是 legacy；仅字符串 "2.0" 接受 v2，其他值拒绝。
  - legacy 的六类卡片、阶段、演示回退与 serviceId 行为保持。v2 只接受六种白名单卡片及严格 sources、actions、target pair、枚举、数组长度、日期/时间、有限数字和正整数；未知键拒绝，原始对象及 tool_summary/failed code 不进入展示状态。
  - v2 events 仅允许 task_started、progress、tool_summary、card_ready、completed、failed；每轮至多接收一张不同卡；completed 前必须已有合法非 error 卡，错误卡或 failed 不能被 completed 翻转，终态后忽略事件并关闭连接。
  - v2 推荐读取 data.items、知识读取 data.answer、待确认读取 data.proposal；proposal 只能展示，绝不视为已创建订单。targetId 不得改名 serviceId，动作只来自严格 actions。
  - Web 仅执行 OPEN_DETAIL 的 PRODUCT/FOOD、OPEN_ORDER_CONFIRMATION 的 FOOD/STAY（STAY targetId 是 roomTypeId）与 RETRY；其他 v2 能力隐藏。小程序 v2 仅执行 RETRY，其他 v2 动作隐藏，避免向 legacy API 发送 typed target；legacy 动作保持。
  - 不修改样式、路由、详情/确认页或请求基础设施；仅作静态范围、协议审查与 git diff --check，不运行测试、构建、服务、浏览器或网络。
