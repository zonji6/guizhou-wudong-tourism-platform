acceptance:
  - Web 会话状态在模块顶层单例：稳定 threadId、messages、四阶段、active/previous card、mode、requestSeq 与唯一 activeSocket；新请求先令旧 seq 失效再关旧连接。删除 setTimeout 假进度和假成功。
  - 两端按扁平事件 type 消费 task_started、node_started、tool_finished、card_ready、completed、failed；客户端在终态主动关闭自己持有的 WebSocket/SocketTask；旧序号与重复 error/close 不污染当前轮。未发生阶段终态为 skipped。
  - 六类 AgentCard 只消费 type/title/summary/data/sources；行程、服务、预约读取真实嵌套字段；来源默认折叠且只显示 title；英文 type、document_id、节点、工具参数、联系人、思维链不展示。
  - 当前卡在新请求开始时保留，新卡到达后才移动为默认折叠“上一版”；去重仅限同 seq；上一版不提供详情、加入、预约等旧动作。
  - 断线或模型 error 不自动回退；仅 error.data.demoAvailable=true 时显示按钮，用户点击后载入两端同构 demoAssistantCard，持续显示演示模式、逐项 demoData 和 keyword_demo 标签。
  - 所有详情、加入、预约动作只使用非空字符串 serviceId；无 ID 不渲染动作。小程序加入行程过滤纯文本节点并按天写 currentItinerary。
  - Web 把资源、详情、社区、预约、后台迁为薄页面；首页插槽和独立助手共享同一会话与 joinedServiceIds；保持 hash 路由与首页沉浸结构。App 适配 HomePage 可能传服务对象或字符串 ID。
  - Web 与小程序所有游客和后台图片统一使用 SafeImage 或等价图片失败色块：列表 lazy、详情 eager；alt 只读 imageAlt/coverAlt，不以标题冒充画面。特别修复预约和后台裸 img；小程序 detail/booking 有实际占位尺寸。
  - 普通预约仅用户提交后 POST /api/bookings，使用日期、人数、联系人、电话四个真实输入；成功响应统一映射 serviceName/travelDate/peopleCount。失败只显示错误，不生成本地 ID 或推进状态。
  - AI pending_booking 已在 Java 建单：Web/小程序先以同一 ID GET /api/bookings/{id}，读取中/失败状态互斥；成功后只 POST /api/bookings/{id}/confirm，绝不再次创建。确认失败不加入订单、不改 CONFIRMED。
  - 后台 PATCH 失败不本地推进。静态初始演示订单可显示，但不把失败写操作伪装成功。
  - 小程序使用 globalData.assistantSession 的稳定 threadId/messages/card；必须保存具体 SocketTask 并调用该实例 close，不使用 wx.closeSocket；onShow selected=2，标题“乌东向导”。
  - pendingBooking 定义为一次性页面交接并在读取后清空，不存联系人或电话；不要同时当长期首页摘要。若没有 currentItinerary，消费后首页继续提示消失属于本轮明确边界，不新增跨页敏感状态。
  - 字符串 UUID 查找，找不到显示不可操作空态，不默认第一项或 id=1。
  - 不修改 demo 数据、HomePage、SafeImage、Java/Python/契约/文档/control 之外产品文件；不创建或运行测试，不构建、不启动、不推送，不访问外部模型或密钥。
